[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rdq-uav"
version = "0.1.0"
description = "Modular RGB-radar dynamic-query experiments for MMAUD V1"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24,<2",
  "Pillow>=9",
  "PyYAML>=6",
  "torch>=2.1",
  "torchvision>=0.16",
  "timm>=1.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
