experiment:
  name: stage4_rdq
  seed: 42
  output_dir: /home/jasoncui/datasets/MMAUD/rdq_uav_experiment/outputs
data:
  root: /home/jasoncui/datasets/MMAUD/v1
  manifest_dir: /home/jasoncui/datasets/MMAUD/rdq_uav_experiment/manifests_oracle_left_fixed256_bbox
  classes:
  - Mavic2
  - Mavic3
  - Avata
  - M300
  - Pham4
  image_mode: dual_full
  center_mask_fraction: 0.0
  bbox_mode: full
  bbox_context_scale: 1.0
  image_size:
  - 288
  - 384
  sync_threshold_ms: 40.0
  num_workers: 0
  eval_num_workers: 0
  pin_memory: true
  persistent_workers: true
  train_color_jitter: 0.0
  image_decode_retries: 3
  split:
    mode: blocked_random
    num_blocks: 12
    train_blocks: 8
    val_blocks: 2
    test_blocks: 2
    guard_seconds: 1.0
    seed: 42
  radar:
    max_points: 768
    max_range_m: 50.0
    normalization: train_standard
    deterministic_eval_sampling: true
  panorama_size:
  - 960
  - 2560
model:
  variant: radar
  num_classes: 5
  embed_dim: 256
  dropout: 0.1
  backbone:
    name: resnet18
    provider: timm
    pretrained: true
    out_index: 2
    fusion: none
    trainable: true
  radar_encoder:
    input_dim: 3
    hidden_dims:
    - 64
    - 128
  attention:
    num_heads: 8
    ffn_ratio: 2
  radar_skip: false
  auxiliary_position:
    enabled: false
    loss_weight: 0.0
  bbox_parameterization: sigmoid_cxcywh
  bbox_reference_wh: null
  attention_output_mode: standard
train:
  epochs: 30
  batch_size: 8
  backbone_lr: 0.0001
  new_modules_lr: 0.0001
  weight_decay: 0.0001
  label_smoothing: 0.1
  amp: true
  grad_clip_norm: 5.0
  class_balanced_sampler: false
  checkpoint_metric: total_loss
  log_interval: 20
  resume: null
  checkpoint_mode: min
evaluation:
  batch_size: 16
  radar_mode: normal
  save_predictions: true
task:
  name: single_uav_joint_2d_3d_localization
loss:
  bbox_regression: smooth_l1
  bbox_l1_weight: 5.0
  giou_weight: 2.0
  position_weight: 1.0
  projection_consistency:
    enabled: false
    weight: 0.0
physical_priors:
  velocity:
    enabled: false
    v_max_soft_mps: 40.0
_config_path: /home/jasoncui/datasets/MMAUD/rdq_uav_experiment/configs/localization/rdq.yaml
