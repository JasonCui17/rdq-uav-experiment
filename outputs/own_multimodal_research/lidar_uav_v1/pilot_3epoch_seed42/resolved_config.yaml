experiment:
  name: lidar_uav_v1
  version: lidar_uav_v1
  seed: 42
  output_dir: outputs/own_multimodal_research/lidar_uav_v1
data:
  root: /home/jasoncui/datasets/MMAUD/official/train
  split_file: outputs/mmuav_paper_reproduction/splits/splits.json
  train_split: train_sub
  val_split: validation_sub
  test_split: heldout_test_sub
  num_merged_frames: 20
  coordinate_config_id: EXISTING_MMUAV_COORDINATE_ASSUMPTION
  denoise: false
  num_workers: 0
model:
  name: lidar_uav_v1
  dim: 128
  voxel:
    scales:
    - 0.5
    - 1.0
    - 2.0
    point_dims:
    - 5
    - 32
    - 64
  transformer:
    heads: 4
    ffn_dim: 256
    blocks_per_level:
    - 2
    - 2
    - 2
    window_size: 64
    window_shift: 32
    relative_range: 32
    l2_global: true
    attention_dropout: 0.0
    ffn_dropout: 0.0
    drop_path: 0.0
  merge:
    use_child_position: true
    use_log_point_count: true
    use_child_ratio: true
    attention_pool: false
    occupancy_mask_input: false
  up:
    adjacent_only: true
  head:
    hidden_dim: 64
    residual_scale_m: 1.0
loss:
  focal_alpha: 0.25
  focal_gamma: 2.0
  smooth_l1_beta: 1.0
  reg_weight: 2.0
selector:
  version: stable_topk100_radius1m_v1
  raw_topk: 20
  pre_nms_topk: 100
  nms_radius_m: 1.0
  final_topk: 20
train:
  epochs: 100
  lr: 0.0002
  betas:
  - 0.9
  - 0.999
  eps: 1.0e-08
  weight_decay: 0.05
  final_lr: 2.0e-06
  warmup_fraction: 0.05
  grad_clip_norm: 1.0
  effective_batch_size: 4
  per_gpu_batch_size: 2
  single_gpu_accumulate: 2
  dual_gpu_accumulate: 1
  amp_dtype: bfloat16
  checkpoint_metric: nms_recall_at_10_1m
evaluation:
  batch_size: 1
  k:
  - 1
  - 5
  - 10
  - 20
  radii_m:
  - 0.5
  - 1.0
  - 2.0
tiny:
  max_samples: 32
  updates: 500
  lr: 0.0002
  weight_decay: 0.0
runtime:
  train_root: /home/jasoncui/datasets/MMAUD/official/train
  val_root: /home/jasoncui/datasets/MMAUD/official/val
  val_reference: /home/jasoncui/datasets/MMAUD/official/validation_ref_new (for your
    ref).csv
  epochs: 3
  device: '0'
  output: /home/jasoncui/projects/rdq-uav-experiment/outputs/own_multimodal_research/lidar_uav_v1/pilot_3epoch_seed42
  precheck_only: false
  max_updates: null
  batch_size_override: 4
  accumulate_override: 1
  num_workers: 8
  prefetch_factor: 2
