extends: ../base.yaml

task:
  name: single_uav_joint_2d_3d_localization

experiment:
  name: stage4_localization
  seed: 42

data:
  manifest_dir: /home/jasoncui/projects/rdq-uav-experiment/manifests_oracle_left_fixed256_bbox
  # Fixed full panorama split only. Neither the transform nor its crop depends on GT.
  image_mode: dual_full
  bbox_mode: full
  center_mask_fraction: 0.0
  bbox_context_scale: 1.0
  image_size: [288, 384]
  panorama_size: [960, 2560]
  train_color_jitter: 0.0
  # Runtime/LR preflight (RTX 3070 Laptop GPU, 16 CPU cores): workers=8 is
  # the measured maximum and therefore the smallest setting within 5% of it.
  num_workers: 8
  eval_num_workers: 8
  pin_memory: true
  persistent_workers: true
  prefetch_factor: 2

model:
  variant: rdq
  bbox_parameterization: sigmoid_cxcywh
  # Populated at runtime from the full train manifest for log-size decoding.
  bbox_reference_wh: null
  radar_skip: true
  auxiliary_position:
    enabled: false
    loss_weight: 0.0

loss:
  bbox_regression: smooth_l1
  bbox_l1_weight: 5.0
  giou_weight: 2.0
  position_weight: 1.0
  projection_consistency:
    enabled: false
    weight: 0.0

physical_priors:
  velocity:
    enabled: false
    v_max_soft_mps: 40.0

train:
  epochs: 30
  batch_size: 8
  amp: true
  # Formal runs are started manually. Validation center error is the default
  # localization monitor and patience counts epochs without improvement.
  checkpoint_metric: bbox_center_error_px_mean
  checkpoint_mode: min
  early_stopping_patience: 15

evaluation:
  batch_size: 16
