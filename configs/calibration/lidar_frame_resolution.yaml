schema_version: 1

dataset_root: /home/jasoncui/datasets/MMAUD/official/v1
manifest_dir: /home/jasoncui/projects/rdq-uav-experiment/manifests_oracle_left_fixed256_bbox

# Both transforms are fitted independently.  No Radar transform is loaded.
sensors:
  lidar_360:
    directory: lidar_360
    min_range_m: 0.1
    max_range_m: 40.0
    distance_bins_m: [0.1, 10.0, 20.0, 30.0, 40.0]
    observability:
      enabled: false
      reason: >-
        The product FOV is known, but the installed sensor-axis convention relative
        to GT is precisely the unknown being fitted. Applying an angular mask before
        resolving that convention would make eligibility depend on the answer.

  livox_avia:
    directory: livox_avia
    min_range_m: 1.0
    max_range_m: 130.0
    distance_bins_m: [1.0, 10.0, 20.0, 30.0, 60.0, 130.0]
    observability:
      enabled: false
      reason: >-
        A reliable installed Avia-to-GT orientation is unavailable. The FOV mask is
        therefore intentionally disabled until the independent frame convention is
        resolved.

fit:
  translation_bound_m: 2.0
  translation_iterations: 20
  rigid_iterations: 100
  robust_distance_clip_m: 5.0
  # Keep the signed-axis convention unless continuous SE(3) improves the train
  # robust nearest-point objective by at least this relative amount.
  min_continuous_improvement: 0.05

validation:
  min_identity_median_gain: 0.30
  min_normal_vs_shuffle_median_gain: 0.20
