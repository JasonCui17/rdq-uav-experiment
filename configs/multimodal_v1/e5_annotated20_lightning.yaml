experiment:
  name: e5_annotated20_lightning
  variant: E5
  seed: 42
  output_dir: outputs/own_multimodal_research/multimodal_v1/e5_annotated20_lightning_seed42
data:
  root: data/mmaud_official_train
  split_file: splits/mmaud_annotated20.json
  train_split: train_sub
  val_split: validation_sub
  max_events: 20
  max_image_gap_s: 0.04
  annotation_manifest: manifests/multimodal_v1/vision_annotated20.jsonl
  camera_config: configs/calibration/mmaud_v1_omni.yaml
  geometry_calibration: calibration/official_left_p4_current_geometry.json
  dino_short_edge: 800
  dino_max_size: 1333
  # Keep decode/resize and latest-20 assembly off the Lightning/GPU thread.
  # Two workers are the conservative WSL2 setting for a 32 GB host.
  num_workers: 2
  prefetch_factor: 2
initialization:
  lidar_config: configs/lidar_uav_v2.yaml
  lidar_checkpoint: checkpoints/lidar_v2/best_spatial.pt
  dino_root: third_party/detrex
  dino_config: third_party/detrex/projects/dino/configs/dino-swin/dino_swin_tiny_224_4scale_12ep.py
  dino_checkpoint: checkpoints/dino_swin_t/dino_swin_tiny_224_22kto1k_finetune_4scale_12ep.pth
  p6_config: configs/multimodal_v1/p6_candidates.yaml
loss:
  lambda_R: 1.0
  lambda_V: 1.0
  lambda_F: 1.0
  lambda_cls: 1.0
  lambda_2d: 2.0
  lambda_3d: 2.0
  lambda_valid: 0.25
  focal_alpha: 0.25
  focal_gamma: 2.0
training:
  epochs: 12
  batch_size: 1
  accumulate: 4
  grad_clip_norm: 1.0
  weight_decay: 0.0001
  warmup_fraction: 0.05
  final_lr_ratio: 0.01
  modality_dropout: 0.0
  stages:
  - {name: T1, start_epoch: 1, end_epoch: 1}
  - {name: T2, start_epoch: 2, end_epoch: 8}
  - {name: T3, start_epoch: 9, end_epoch: 12}
  learning_rates:
    new_modules: 0.0001
    radar: 0.00002
    dino_head: 0.00001
    swin_last_two: 0.000001
validation:
  every_epochs: 1
  precision: fp32
  max_samples: null
logging:
  log_every_updates: 20
lightning:
  accelerator: gpu
  devices: 1
  precision: 16-mixed
  # The default 65536 scale skipped the first six real E5 optimizer attempts.
  # 1024 is the stable scale reached by that gate and preserves LR warmup.
  amp_initial_scale: 1024
  # Rolling last.ckpt about every 15-20 minutes on the RTX 3070.
  checkpoint_every_updates: 250
  deterministic: warn
  num_sanity_val_steps: 1
  early_stopping:
    enabled: true
    # Equal to the full schedule, so this records the contract without silently
    # shortening the currently frozen 12-epoch E5 experiment.
    patience: 12
    min_delta: 0.0
