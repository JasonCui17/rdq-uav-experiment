# P4 preregistration template.
#
# Workflow:
# 1) run train_sub in dry-run mode;
# 2) choose explicit numeric rules from train diagnostics only;
# 3) set thresholds_frozen: true and commit this file;
# 4) run validation_sub formal audit without editing thresholds afterward.
#
# Do not store a commit SHA inside this YAML: that is self-referential.
# The formal audit records the last commit that changed this exact file.
thresholds_frozen: false
thresholds: {}
