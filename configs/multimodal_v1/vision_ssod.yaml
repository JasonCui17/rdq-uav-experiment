# Geometry-Guided Semi-Supervised DINO for MMAUD left camera.
# 3D projection is a weak cue only; it is never synthesized into a bbox GT.
data:
  root: /home/jasoncui/datasets/MMAUD/official/train
  split_file: outputs/mmuav_paper_reproduction/splits/splits.json
  train_split: train_sub
  annotation_manifest: manifests/multimodal_v1/vision_5pct_annotations.jsonl
  camera_config: configs/calibration/mmaud_v1_omni.yaml
  geometry_calibration: calibration/official_left_p4_current_geometry.json
  max_image_gap_s: 0.04
  labeled_train_fraction: 0.04
  calibration_fraction: 0.01
  range_edges_m: [20.0, 40.0, 60.0, 100.0]
  seed: 20260922

model:
  detrex_root: third_party/detrex
  config: third_party/detrex/projects/dino/configs/dino-swin/dino_swin_tiny_224_4scale_12ep.py
  checkpoint: checkpoints/dino_swin_t/dino_swin_tiny_224_22kto1k_finetune_4scale_12ep.pth
  num_classes: 1

optimizer:
  type: AdamW
  lr: 0.0001
  backbone_lr: 0.00001
  weight_decay: 0.0001
  grad_clip_norm: 0.1
  amp: true

burn_in:
  steps: 1000

ssod:
  steps: 4000
  unlabeled_per_step: 3
  ema_decay: 0.999
  lambda_unsup: 1.0
  ramp_fraction: 0.10
  weak_short_edges: [720, 800, 880]
  max_size: 1333
  horizontal_flip_p: 0.5
  # High: full cls + L1 + GIoU.
  high_geometry_px: 16.0
  high_stability_iou: 0.60
  high_min_precision: 0.95
  high_success_iou: 0.50
  # Medium: classification only. This IoU threshold defines calibration
  # "localized correct" and does not become a regression target.
  medium_geometry_px: 32.0
  medium_stability_iou: 0.40
  medium_min_precision: 0.80
  medium_success_iou: 0.10
  calibration_min_count: 5

output:
  directory: outputs/own_multimodal_research/vision_ssod
  log_every: 20
  save_every: 500
