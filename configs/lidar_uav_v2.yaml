experiment:
  name: lidar_uav_v2
  version: lidar_uav_v2_query_causal_v1
  seed: 42
  output_dir: outputs/own_multimodal_research/lidar_uav_v2
data:
  root: /home/jasoncui/datasets/MMAUD/official/train
  split_file: outputs/mmuav_paper_reproduction/splits/splits.json
  train_split: train_sub
  val_split: validation_sub
  test_split: heldout_test_sub
  num_merged_frames: 20
  query_mode: gt_timestamp
  coordinate_config_id: EXISTING_MMUAV_COORDINATE_ASSUMPTION
  denoise: false
  num_workers: 0
model:
  name: lidar_uav_v2
  dim: 128
  voxel:
    scales: [0.5, 1.0, 2.0]
    point_dims: [5, 32, 64]  # Only instantiated when embedding=legacy.
    embedding: sbe_lite
    sbe:
      subdivisions: 2
      slots: 8
      slot_dim: 11
      flattened_dim: 88
      output_dim: 128
  transformer:
    heads: 4
    ffn_dim: 256
    blocks_per_level: [2, 2, 2]
    window_size: 64
    window_shift: 32
    relative_range: 32
    l2_global: true
    attention_dropout: 0.0
    ffn_dropout: 0.0
    drop_path: 0.0
  merge:
    use_child_position: true
    use_log_point_count: true
    explicit_octant_occupancy: true
    occupancy_slots: 8
    attention_pool: false
  up:
    adjacent_only: true
  head:
    hidden_dim: 64
    residual_scale_m: 1.0
loss:
  focal_alpha: 0.25
  focal_gamma: 2.0
  smooth_l1_beta: 1.0
  reg_weight: 2.0
  temporal_weight: 1.0
  temporal_smooth_l1_beta: 1.0
selector:
  version: stable_topk100_radius1m_v1
  raw_topk: 20
  pre_nms_topk: 100
  nms_radius_m: 1.0
  final_topk: 20
train:
  epochs: 100
  lr: 0.0002
  betas: [0.9, 0.999]
  eps: 1.0e-8
  weight_decay: 0.05
  final_lr: 0.000002
  warmup_fraction: 0.05
  grad_clip_norm: 1.0
  effective_batch_size: 4
  per_gpu_batch_size: 2
  single_gpu_accumulate: 2
  dual_gpu_accumulate: 1
  amp_dtype: bfloat16
  checkpoint_metric: nms_recall_at_10_1m
  query_subsampling:
    enabled: true
    stride: 4
    offset_policy: cyclic_epoch
    anchor: clip_end
    dense_clip_context: true
    shuffle_selected: true
  unique_query_packing:
    enabled: true
    overlap_aware_batching: true
    dedup_key: sequence_query_uid
evaluation:
  batch_size: 1
  k: [1, 5, 10, 20]
  radii_m: [0.5, 1.0, 2.0]
tiny:
  max_samples: 32
  updates: 500
  lr: 0.0002
  weight_decay: 0.0

temporal:
  enabled: true
  clip_length: 8
  stride: 1
  dim: 128
  heads: 4
  ffn_dim: 256
  blocks: 2
  dropout: 0.0
  time_encoding:
    input_dim: 2
    hidden_dim: 32
  candidate_pool: softmax_objectness
  use_xyz_embedding: true
  use_presence_embedding: true
  causal: true
